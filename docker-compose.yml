services:
  postgres:
    image: postgres:16.4-alpine
    container_name: vacation_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vacation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vacation}
      POSTGRES_DB: ${POSTGRES_DB:-vacation}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vacation} -d ${POSTGRES_DB:-vacation}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
