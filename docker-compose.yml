services:
  postgres:
    image: postgres:16.4-alpine
    container_name: vacation_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vacation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vacation}
      POSTGRES_DB: ${POSTGRES_DB:-vacation}
    ports:
      # 5433 on the host, to avoid colliding with a locally installed Postgres
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vacation} -d ${POSTGRES_DB:-vacation}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: vacation_backend
    restart: unless-stopped
    environment:
      # Inside the network Postgres is reachable by service name on its own port.
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-vacation}
      DB_USER: ${POSTGRES_USER:-vacation}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-vacation}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      FRONT_END_URL: http://localhost:5173
      LAMBDA_NAME: vacation-api
      ALIAS: dev
    ports:
      - "8888:8888"
    volumes:
      # Source is mounted for reloads; node_modules stays the image's own copy.
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    # The seed is idempotent, so one `up` creates the schema and demo users too.
    command: sh -c "npm run seed && npm run dev"

  frontend:
    build: ./frontend
    container_name: vacation_frontend
    restart: unless-stopped
    environment:
      VITE_API_PROXY_TARGET: http://backend:8888
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
