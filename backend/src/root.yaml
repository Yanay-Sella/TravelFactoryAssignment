openapi: 3.0.3
info:
  title: Vacation Request API
  version: 1.0.0
  description: Manage employee vacation requests (submission and validation).
paths:
  /auth/login:
    post:
      summary: Exchange credentials for a JWT
      x-handler: handlers/auth#login
      x-inputParser: handlers/auth#parseLoginInput
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Token and the authenticated user
        '400':
          description: Malformed body
        '401':
          description: Invalid email or password

  /auth/me:
    get:
      summary: The authenticated user, for frontend session restore
      x-handler: handlers/auth#me
      x-inputParser: handlers/auth#parseMeInput
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The authenticated user
        '401':
          description: Missing, invalid or expired token

  /vacation-requests:
    post:
      summary: Submit a vacation request (Requester only)
      x-handler: handlers/vacationRequests#createVacationRequest
      x-inputParser: handlers/vacationRequests#parseCreateVacationRequestInput
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [startDate, endDate]
              properties:
                startDate:
                  type: string
                  format: date
                endDate:
                  type: string
                  format: date
                reason:
                  type: string
                  nullable: true
      responses:
        '201':
          description: The created request, status Pending
        '400':
          description: Malformed body or a business rule violation
        '401':
          description: Missing, invalid or expired token
        '403':
          description: Caller is not a Requester
    get:
      summary: List the caller's own vacation requests (Requester only)
      x-handler: handlers/vacationRequests#listMyRequests
      x-inputParser: handlers/vacationRequests#parseListMyRequestsInput
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Paginated requests belonging to the caller
        '400':
          description: Invalid pagination parameters
        '401':
          description: Missing, invalid or expired token
        '403':
          description: Caller is not a Requester

  /vacation-requests/all:
    get:
      summary: List every vacation request, filterable (Validator only)
      x-handler: handlers/vacationRequests#listAllRequests
      x-inputParser: handlers/vacationRequests#parseListAllRequestsInput
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [Pending, Approved, Rejected]
        - in: query
          name: userId
          schema:
            type: string
            format: uuid
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Paginated requests across all users, each with its requester
        '400':
          description: Invalid status, userId or pagination parameters
        '401':
          description: Missing, invalid or expired token
        '403':
          description: Caller is not a Validator

  /vacation-requests/team:
    get:
      summary: Approved vacations across the team (both roles)
      x-handler: handlers/vacationRequests#listTeamPlanning
      x-inputParser: handlers/vacationRequests#parseTeamPlanningInput
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Approved vacations, earliest first, without reason or comments
        '400':
          description: Invalid pagination parameters
        '401':
          description: Missing, invalid or expired token

  /vacation-requests/:id/approve:
    patch:
      summary: Approve a pending vacation request (Validator only)
      x-handler: handlers/validation#approveVacationRequest
      x-inputParser: handlers/validation#parseApproveVacationRequestInput
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The approved request
        '400':
          description: Malformed request id
        '401':
          description: Missing, invalid or expired token
        '403':
          description: Caller is not a Validator
        '404':
          description: No such vacation request
        '409':
          description: The request has already been approved or rejected

  /vacation-requests/:id/reject:
    patch:
      summary: Reject a pending vacation request with a comment (Validator only)
      x-handler: handlers/validation#rejectVacationRequest
      x-inputParser: handlers/validation#parseRejectVacationRequestInput
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comments]
              properties:
                comments:
                  type: string
                  description: Required explanation shown to the requester
      responses:
        '200':
          description: The rejected request, including the comment
        '400':
          description: Malformed request id, body, or a missing rejection comment
        '401':
          description: Missing, invalid or expired token
        '403':
          description: Caller is not a Validator
        '404':
          description: No such vacation request
        '409':
          description: The request has already been approved or rejected

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
